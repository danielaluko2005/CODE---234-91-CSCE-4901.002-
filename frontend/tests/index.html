
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOME ALERT - Regression Tests</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #172b4d;
        }

        button {
            background: #2357b7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .result {
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
        }

        .pass {
            background: #e2f5e8;
        }

        .fail {
            background: #ffe5e5;
        }

        .pending {
            background: #eeeeee;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>DOME ALERT - Sprint 2 Tests</h1>

    <p>
        Automated regression tests for the Home Dashboard.
        These tests use simulated network events.
    </p>

    <button id="runButton" type="button">
        Run All Tests
    </button>

    <h2 id="summary">
        Tests not started
    </h2>

    <div id="results" aria-live="polite"></div>

    <h2>Dashboard Preview</h2>

    <iframe
        id="dashboard"
        title="Dashboard under test"
        src="../space.html"
    ></iframe>

    <script type="module">
        const button =
            document.getElementById("runButton");

        const results =
            document.getElementById("results");

        const summary =
            document.getElementById("summary");

        const frame =
            document.getElementById("dashboard");

        const wait = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

        async function reloadDashboard() {
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    reject(new Error("Dashboard load timed out"));
                }, 5000);

                frame.onload = () => {
                    clearTimeout(timeout);
                    resolve();
                };

                frame.src =
                    "../space.html?test=" + Date.now();
            });

            await wait(650);
        }

        function displayResult(name, status, detail = "") {
            const item = document.createElement("div");

            item.className =
                "result " + status.toLowerCase();

            item.textContent =
                status + ": " + name +
                (detail ? " - " + detail : "");

            results.appendChild(item);
        }

        button.addEventListener("click", async () => {
            button.disabled = true;
            results.innerHTML = "";

            let passed = 0;
            let failed = 0;
            let pending = 0;

            for (let number = 1; number <= 18; number++) {
                const filename =
                    `./test-${String(number).padStart(2, "0")}.js`;

                try {
                    const response = await fetch(filename, {
                        cache: "no-store"
                    });

                    if (response.status === 404) {
                        pending++;

                        displayResult(
                            `Test ${number}`,
                            "PENDING",
                            "Test file not yet created"
                        );

                        continue;
                    }

                    if (!response.ok) {
                        throw new Error(
                            `HTTP ${response.status}`
                        );
                    }

                    const module = await import(filename);

                    await reloadDashboard();

                    const result = await module.run(
                        frame.contentWindow,
                        frame.contentDocument
                    );

                    if (result === true) {
                        passed++;
                        displayResult(module.name, "PASS");
                    } else {
                        failed++;
                        displayResult(module.name, "FAIL");
                    }

                } catch (error) {
                    failed++;

                    displayResult(
                        `Test ${number}`,
                        "FAIL",
                        error.message
                    );
                }
            }

            summary.textContent =
                `Passed: ${passed} | Failed: ${failed} | Pending: ${pending}`;

            button.disabled = false;
        });
    </script>

</body>
</html>
